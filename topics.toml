# The topics of leanmachinelearning.org/library: which folders of LML, LMLExplore and Statlib make
# up each subject. Drafted from the folders, module titles and roadmaps; correct it freely. The
# titles and summaries are shown on the site as written here.
#
# Each [[topic]]:
#   id        a short name, used by `parent` and in the site's addresses
#   title     as the site shows it
#   section   on the home page: "learning", "statistics" or "tools" (top-level topics only;
#             a subtopic is shown in its parent's section)
#   parent    the id of the topic it belongs to, if any
#   featured  also shown on the home page, though it has a parent
#   summary   one line, for the topic's card
#   synonyms  what readers may search for
#   roadmap   its roadmap: a directory of LMLRoadmaps
#   folders   for each library (LML, LMLExplore, Statlib), paths relative to the library's root
#             (LeanMachineLearning/, LMLExplore/, Statlib/): folders, or single files without .lean.
#             A file belongs to the topic with the longest path that contains it, so a subfolder or
#             a file can go to a more specific topic than its folder.

