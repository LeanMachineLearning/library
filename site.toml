# The library site of Lean Machine Learning (referee-site library --config site.toml).

title = "What is formalized in Lean Machine Learning"
brand = "Lean Machine Learning"
home = "https://leanmachinelearning.org/"
intro = "Definitions and theorems of machine learning theory, with every proof checked by Lean. Search in words, or browse by topic, by the literature, or by the papers built on the libraries."
about = "Lean checks every proof, whoever wrote it. What still needs a person is whether each statement, and the definitions under it, say what they should. Every page shows which library a result comes from, and who has reviewed what it rests on."
libraries_title = "Three libraries, one site"
topics = "topics.toml"
# Packages trusted with everything they depend on: their declarations are not drawn in graphs.
trust = ["mathlib"]
tries = ["regret of UCB", "testing by betting", "chain rule for the Kullback–Leibler divergence", "policy iteration", "lower bound for best-arm identification"]

[[nav]]
label = "LML Core"
href = "https://leanmachinelearning.org/#goals"
[[nav]]
label = "Tutorials"
href = "https://leanmachinelearning.org/LML/tutorial"
[[nav]]
label = "Library"
href = "https://leanmachinelearning.org/library/"
