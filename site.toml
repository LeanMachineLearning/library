[[section]]
id = "learning"
title = "Learning"
[[section]]
id = "statistics"
title = "Statistics"
[[section]]
id = "tools"
title = "Mathematical tools"

# The libraries, each a package of the dataset, in the order the site shows them. `store` is where
# its declarations are reviewed; `kind` how it is written: people, ai or other.
[[library]]
name = "LML"
package = "LeanMachineLearning"
repo = "LeanMachineLearning/LML"
store = "LeanMachineLearning/LML-evidence"
kind = "people"
process = "Reviewed by its maintainers before merging"
summary = "The curated core: the objects of machine learning theory and the main theorems about them. Every change is reviewed by people before it is merged."

[[library]]
name = "LMLExplore"
package = "LMLExplore"
repo = "LeanMachineLearning/LMLExplore"
store = "LeanMachineLearning/LMLExplore-evidence"
kind = "ai"
process = "Written by AI agents, along roadmaps written by people"
summary = "Machine learning theory written by AI agents and merged after AI review once Lean checks it. Whether a statement says the right thing is shown on its page, with any reviews."

[[library]]
name = "Statlib"
package = "Statlib"
repo = "stat-lib/statlib"
store = "LeanMachineLearning/LML-evidence"
kind = "other"
process = "The statistics library of the stat-lib project"
summary = "Mathematical statistics, which LML builds on: divergences, hypothesis testing, e-values."

# Upstream packages drawn in graphs, as the site names them.
[[upstream]]
package = "TauCeti"
name = "Tau Ceti"
kind = "ai"
note = "written by AI, not audited here"

[contribute]
intro = "Lean Machine Learning grows through people who say whether statements are right, people who write the roadmaps, and AI agents run by anyone."
workerTitle = "Run a worker, in two lines"
worker = ["uv tool install git+https://github.com/TauCetiProject/TauCetiWorker",
          "tauceti --conf https://raw.githubusercontent.com/LeanMachineLearning/LMLExplore/main/tauceti.toml work --loop"]
workerText = "The worker uses your Claude or Codex subscription and opens pull requests on LMLExplore from your own GitHub account. Each round it picks one job: a review, a fix, or a new item of a roadmap. [Prerequisites, and one round first](https://github.com/LeanMachineLearning/LMLExplore#contributing)."

[[contribute.ways]]
title = "Review a statement"
text = "Is it correctly stated? Answer yes or no in a short GitHub form. No Lean needed."
href = "#/contribute"
[[contribute.ways]]
title = "Write or review a roadmap"
text = "Decide what LMLExplore formalizes next, in your area."
href = "https://github.com/LeanMachineLearning/LMLRoadmaps"
[[contribute.ways]]
title = "Formalize your paper"
text = "Start from the paper template and its Claude Code plugin."
href = "https://leanmachinelearning.org/formalize/"
[[contribute.ways]]
title = "Bring material to LML"
text = "Propose reviewed definitions and theorems for the core."
href = "https://github.com/LeanMachineLearning/LML/blob/main/CONTRIBUTING.md"
